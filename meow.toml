# yozora build, run by tools/meow: the compile graph of the C core, the app, the host tests, the strip and signing,
# the release checks and the ipa live here. the dependency builds that meow does not model (the llvm runtime, icu,
# the web and text archives, WebKit through cmake and ninja) stay in scripts/ and run as steps; the library graph
# cmake computes for the app reaches meow as a response file (scripts/export_link_line.py)
#
#   meow build              the ipa of each slice
#   meow build ipa          one ipa with both slices
#   meow test               the host tests
#   meow plan app-fat       what is stale, runs nothing

default = ["ipa-armv7", "ipa-arm64"]

[vars]
TC = "${YOZORA_TC:-${MEOW_TC}}"
# the legacy armv7 sdk (ios 5 headers and the crt1.3.1.o start file) and the patched arm64 sdk of the dependency build
# absolute: the cmake scripts take these paths and reject a relative sysroot
DEPS = "${YOZORA_CORE_DEPS:-${root}/build/core/deps}"
SDK_V7 = "${YOZORA_SDK_V7:-${DEPS}/sdk/iPhoneOS-armv7.sdk}"
SDK_V64 = "${YOZORA_SDK_V64:-${DEPS}/sdk/iPhoneOS-arm64.sdk}"
# the sdk version written into the arm64 binary. ld 253 reads it from the digits of the sdk directory name, and
# "iPhoneOS-arm64.sdk" gave 64.0, so ios treated the app as linked against an sdk that does not exist. this is the
# version of the headers the patched sdk was made from
SDK_V64_VERSION = "${YOZORA_SDK_V64_VERSION:-16.5}"
CRT_V7 = "${YOZORA_CRT_V7:-${SDK_V7}/usr/lib/crt1.3.1.o}"
# the cmake tree of the webcore libraries (jit build, armv7 and arm64 in one directory) for webkitgtk-2.54.3. a cmake tree is tied to
# the path of its sources, so a new WebKit version in a new directory means a new tree and a full build
WEB = "${YOZORA_WEBCORE_IOS_BUILD:-${root}/build/core/webcore-ios-jit-2543}"
ENTITLEMENTS = "tools/yozora-jit.entitlements"

[slice.armv7]
cc = "${TC}/clang"
ar = "${TC}/llvm-ar"
flags = ["-target", "armv7-apple-ios5.0", "-B", "${TC}", "-mlinker-version=253", "-isysroot", "${SDK}"]
[slice.armv7.vars]
SDK = "${SDK_V7}"

[slice.arm64]
cc = "${TC}/clang"
ar = "${TC}/llvm-ar"
flags = ["-target", "arm64-apple-ios7.0", "-mcpu=apple-a7", "-B", "${TC}", "-mlinker-version=253", "-isysroot", "${SDK}"]
[slice.arm64.vars]
SDK = "${SDK_V64}"

# the C core and the store tool

[target.yozora]
slices = ["armv7", "arm64"]
link = "archive"
output = "build/${slice}/libyozora.a"
cflags = ["-std=c99", "-Wall", "-Wextra", "-Werror", "-O2", "-Icore"]
[[target.yozora.src]]
files = ["core/yozora_types.c", "core/yozora_navigation.c", "core/yozora_store.c"]

[target.yozora-store]
slices = ["armv7", "arm64"]
output = "build/${slice}/yozora-store"
objects_from = ["yozora"]
cflags = ["-std=c99", "-Wall", "-Wextra", "-Werror", "-O2", "-Icore"]
ldflags = ["-lsqlite3"]
[target.yozora-store.per_slice.armv7]
# ios 5 starts executables with crt1.3.1.o, ld64 picks it by name only with the default start files
ldflags = ["-nostartfiles", "${CRT_V7}"]
[[target.yozora-store.src]]
files = ["tools/yozora_store_cli.c"]

[fat.yozora-fat]
from = "yozora"
output = "build/ios/libyozora.a"

[fat.yozora-store-fat]
from = "yozora-store"
output = "build/ios/yozora-store"

# the app: the objective-c sources compile here, the libraries come from the cmake tree

# one target per slice for the single-slice ipas, so that an armv7 package does not wait for the arm64 WebKit build;
# `app` has both slices for the universal ipa

[target.app-armv7]
slices = ["armv7"]
output = "build/armv7/Yozora"
# manual reference counting, every warning is an error, the same flags cmake gave the Yozora target
cflags = ["-fno-objc-arc", "-fno-strict-aliasing", "-fno-exceptions", "-fPIE", "-std=gnu17", "-O3", "-DNDEBUG",
          "-Wall", "-Wextra", "-Werror", "-Icore", "-Icore/core"]
# the response file holds YozoraCore, WebCore, JavaScriptCore, the dependency archives, libc++ and the frameworks in
# the order cmake linked them; CoreLocation is named here as well because a tree configured before the location
# code did not list it
ldflags = ["-Wl,-search_paths_first", "-Wl,-headerpad_max_install_names", "-Xlinker", "-dead_strip",
           "-framework", "CoreLocation", "-framework", "Security", "-Wl,-map,build/${slice}/Yozora.map", "@build/${slice}/link.rsp"]
needs = ["webcore-${slice}"]
strip = true
entitlements = "${ENTITLEMENTS}"
[target.app-armv7.per_slice.armv7]
ldflags = ["-nostartfiles", "${CRT_V7}"]
[[target.app-armv7.src]]
files = [
  "app/app_main.m", "app/YZBrowserController.m", "app/YZPageView.m", "app/YZSceneView.m", "app/YZTheme.m",
  "app/YZMotion.m", "app/YZSystemSheet.m", "app/YZControls.m", "app/YZFavicons.m", "app/YZStore.m", "app/YZTab.m", "app/YZHomeView.m",
  "app/YZErrorPage.m", "app/YZTabsView.m", "app/YZMenuView.m", "app/YZPopupMenu.m", "app/YZAppIcon.m", "app/YZClassic.m", "app/YZListController.m", "app/YZDownloadsController.m",
  "app/YZSettings.m", "app/YZSettingsController.m", "app/YZStrings.m", "app/YZLocation.m", "app/YZVideoController.m",
  "app/YZAccentEditor.m", "app/YZTintPicker.m", "app/YZMascotPreview.m", "app/YZBackground.m", "app/YZBackgroundPreview.m", "app/YZDnsPopup.m", "app/YZWaveSeekBar.m", "app/YZPlayerViews.m", "app/YZStreamProxy.m", "app/YZUpdate.m", "app/YZUpdateUI.m", "app/YZMediaPlayer.m",
  "app/YZFindBar.m", "app/YZSheets.m", "app/YZDialog.m", "app/YZErrorPopup.m", "app/YZShape.m", "app/YZLog.m",
  "app/YZCrash.m", "app/YZLogController.m", "app/YZSystemNotifier.m", "app/YZSitesController.m", "app/YZCertificates.m", "app/YZCertificatesController.m",
  "app/YZAdblockController.m", "app/YZDebugOverlay.m", "app/YZTranslation.m", "app/YZTranslateBar.m",
  "app/YZTranslateSheet.m", "app/YZColorPicker.m", "app/YZSplashController.m", "app/YZTabStrip.m", "app/YZTabPager.m", "app/YZTabStack.m", "app/YZSignIn.m",
  "app/YZPasswords.m", "app/YZPasswordsController.m",
  # the blur of the start page photo is used by the app only, so it is built here and not in libYozoraCore (which needs a webkit build)
  "core/yozora_blur.c",
  # the site of a password and whether to offer saving it, app only like the blur
  "core/yozora_password.c",
  # libSystem has no ___divdc3 for arm64 (see the file), the empty file on armv7 costs nothing
  "core/yozora_divdc3.c",
