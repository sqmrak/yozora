[ipa.ipa]
output = "build/ipa/Yozora.ipa"
prefix = "Payload/Yozora.app"
needs = ["release-universal"]

[[ipa.ipa.file]]
from = "build/Yozora"
to = "Yozora"
mode = "755"

[[ipa.ipa.file]]
from = "app/Info.plist"
to = "Info.plist"

[[ipa.ipa.file]]
from = "app/ca-bundle.crt"
to = "ca-bundle.crt"

[[ipa.ipa.file]]
