[test.types]
src = [
  "core/yozora_types.c", "core/yozora_navigation.c", "core/yozora_store.c", "core/yozora_address.c",
  "core/yozora_accent.c", "core/yozora_playlist.c", "core/yozora_mp4.c", "core/yozora_ts.c", "core/yozora_hls.c",
  "core/yozora_log.c", "core/yozora_blocklist.c", "core/yozora_filter.c", "core/yozora_sitegrants.c",
  "core/yozora_budget.c", "core/yozora_translate.c", "core/yozora_httpcache.c", "core/yozora_keys.c",
  "core/yozora_motion.c", "core/yozora_zoom.c", "core/yozora_debug.c", "core/yozora_transfer.c", "core/yozora_color.c",
  "core/yozora_render_plan.c", "core/core/yozora_scene_animation.c", "tests/test_types.c",
]
