# dependency builds and the cmake tree, run as scripts: meow orders them and skips what is built

# the WebKit sources of core/source.json, the host gperf and the cross dependencies; each script wipes and refills its
# own directory, so the steps run only while their outputs are missing (`meow clean NAME` then `meow build NAME` forces one)
# the deb is cut from the checked ipa, see packaging/ and scripts/build_deb.sh
[step.deb]
run = [["bash", "scripts/build_deb.sh"]]
needs = ["ipa"]
env = { YOZORA_TC = "${TC}" }
inputs = ["packaging/DEBIAN/*", "scripts/build_deb.sh", "app/Info.plist", "tools/yozora-jit.entitlements"]
outputs = ["build/ipa/Yozora-v${field:packaging/DEBIAN/control:Version}.deb"]

[step.core-fetch]
run = [["python3", "-B", "scripts/fetch_core.py"]]
inputs = ["core/source.json", "scripts/fetch_core.py"]
stamp = "build/.stamps/core-fetch"

[step.core-tools]
run = [["python3", "-B", "scripts/build_core_tools.py"]]
needs = ["core-fetch"]
inputs = ["scripts/build_core_tools.py", "core/build-tools.json"]
outputs = ["build/core/deps/host/tools/bin/gperf"]
bootstrap = true

[step.core-deps]
run = [["bash", "scripts/build_core_deps.sh"]]
needs = ["core-fetch"]
env = { YOZORA_TC = "${TC}", YOZORA_SDK_V7 = "${SDK_V7}", YOZORA_SDK_V64 = "${SDK_V64}", YOZORA_CRT_V7 = "${CRT_V7}" }
outputs = ["build/core/deps/armv7/runtime/lib/libc++.a", "build/core/deps/arm64/runtime/lib/libc++.a",
           "build/core/deps/armv7/icu/lib/libicuuc.a", "build/core/deps/arm64/icu/lib/libicuuc.a"]
bootstrap = true

[step.text-deps]
run = [["bash", "scripts/build_text_deps.sh", "ios"]]
needs = ["core-deps"]
env = { YOZORA_TC = "${TC}", YOZORA_SDK_V7 = "${SDK_V7}", YOZORA_SDK_V64 = "${SDK_V64}", YOZORA_CRT_V7 = "${CRT_V7}" }
outputs = ["build/core/deps/armv7/text/lib/libharfbuzz.a", "build/core/deps/arm64/text/lib/libharfbuzz.a"]
bootstrap = true

[step.web-deps]
run = [["python3", "-B", "scripts/build_web_deps.py", "ios"]]
needs = ["core-deps"]
env = { YOZORA_TC = "${TC}", YOZORA_SDK_V7 = "${SDK_V7}", YOZORA_SDK_V64 = "${SDK_V64}", YOZORA_CRT_V7 = "${CRT_V7}" }
outputs = ["build/core/deps/armv7/web/yozora-inputs.json", "build/core/deps/arm64/web/yozora-inputs.json"]
bootstrap = true

# WebKit through cmake and ninja, one step per slice. YOZORA_BUILD_APP=0 leaves the Yozora executable to meow, then
# the link line cmake computed for it is written as the response file the app target links with. ninja has its own
# graph, so a stale step only asks it what changed

# the map of each link kept under the uuid of its binary, so a crash report of an older build can be read: tools/yozora_ips.py
[step.symbols-armv7]
run = [["python3", "-B", "scripts/archive_symbols.py", "armv7"]]
needs = ["app-armv7"]
inputs = ["build/armv7/Yozora", "build/armv7/Yozora.map", "scripts/archive_symbols.py"]
outputs = ["build/symbols/armv7-latest.txt"]

[step.symbols-arm64]
run = [["python3", "-B", "scripts/archive_symbols.py", "arm64"]]
needs = ["app-arm64"]
inputs = ["build/arm64/Yozora", "build/arm64/Yozora.map", "scripts/archive_symbols.py"]
outputs = ["build/symbols/arm64-latest.txt"]

[step.webcore-armv7]
run = [["bash", "scripts/build_webcore_ios.sh", "webcore"],
       ["python3", "-B", "scripts/export_link_line.py", "${WEB}/armv7", "build/armv7/link.rsp"]]
needs = ["core-tools", "core-deps", "text-deps", "web-deps"]
env = { YOZORA_TC = "${TC}", YOZORA_SDK_V7 = "${SDK_V7}", YOZORA_SDK_V64 = "${SDK_V64}", YOZORA_SLICES = "armv7", YOZORA_BUILD_APP = "0", YOZORA_WEBCORE_IOS_BUILD = "${WEB}" }
inputs = ["core/**/*.c", "core/**/*.cpp", "core/**/*.h", "core/**/*.hpp", "core/webgl/*.py", "core/*.cmake", "core/patches/*.patch",
          "core/*.json", "scripts/build_webcore_ios.sh", "scripts/apply_core_patches.py", "scripts/export_link_line.py"]
outputs = ["build/armv7/link.rsp"]
keep = true

[step.webcore-arm64]
run = [["bash", "scripts/build_webcore_ios.sh", "webcore"],
       ["python3", "-B", "scripts/export_link_line.py", "${WEB}/arm64", "build/arm64/link.rsp"]]
needs = ["core-tools", "core-deps", "text-deps", "web-deps"]
env = { YOZORA_TC = "${TC}", YOZORA_SDK_V7 = "${SDK_V7}", YOZORA_SDK_V64 = "${SDK_V64}", YOZORA_SLICES = "arm64", YOZORA_BUILD_APP = "0", YOZORA_WEBCORE_IOS_BUILD = "${WEB}" }
inputs = ["core/core/*.mm", "core/**/*.c", "core/**/*.cpp", "core/**/*.h", "core/**/*.hpp", "core/webgl/*.py", "core/*.cmake", "core/patches/*.patch",
          "core/*.json", "scripts/build_webcore_ios.sh", "scripts/apply_core_patches.py", "scripts/export_link_line.py"]
outputs = ["build/arm64/link.rsp"]
keep = true

# host builds and the other ios probes, by name: `meow build webcore-host`
[step.core-host]
run = [["bash", "scripts/build_core_host.sh"]]
